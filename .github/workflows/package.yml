name: Verify package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m pip install -e '.[redis,asgi]'
      - name: Check clean Django installation
        env:
          PYTHONPATH: packaging/consumer_smoke
        run: |
          python -m django check --settings=logcollector_package_settings
          python -m django makemigrations --check --dry-run --settings=logcollector_package_settings
          python -m django test test_appearance test_optional_models test_auto_block_defaults test_dashboard_views test_dashboard_access --settings=logcollector_package_settings --noinput
          python -m django test test_access_group_migrations --settings=logcollector_package_settings --noinput
          python -m unittest discover -s packaging/consumer_smoke -p test_portable_imports.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect archives and installed wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          guides = {'installation.md', 'configuration.md', 'api.md', 'operations-guide.md', 'performance-guide.md'}
          for archive in Path('dist').iterdir():
              if archive.suffix == '.whl':
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
              else:
                  with tarfile.open(archive) as package:
                      names = package.getnames()
              found = {Path(name).name for name in names if '/log_collector/docs/' in '/' + name}
              assert found == guides, (archive, found)
              assert any(name.endswith('LICENSE') for name in names)
              assert any(name.endswith('log_collector/migrations/0004_app_appearance.py') for name in names)
              assert any(name.endswith('log_collector/migrations/0005_access_groups.py') for name in names)
              assert any(name.endswith('crowdsec_integration/migrations/0001_initial.py') for name in names)
          PY
          python -m venv /tmp/logcollector-wheel
          /tmp/logcollector-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/logcollector-wheel/bin/python - <<'PY'
          from importlib.resources import files
          import log_collector
          import crowdsec_integration
          assert (files('log_collector') / 'docs' / 'installation.md').is_file()
          print('installed wheel and guide verified')
          PY
